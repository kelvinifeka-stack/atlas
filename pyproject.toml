[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "Engineering reasoning engine"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "networkx>=3.0",
]

[project.scripts]
atlas = "atlas_cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "atlas_core",
    "atlas_core.*",
    "atlas_cli",
    "atlas_cli.*",
]
exclude = [
    "tests",
    "tests.*",
    "research",
    "research.*",
    "papers",
    "papers.*",
    "assets",
    "assets.*",
    "notebooks",
    "notebooks.*",
    "experiments",
    "experiments.*",
    "case_studies",
    "case_studies.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]