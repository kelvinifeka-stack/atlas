[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.1.0"
description = "Engineering reasoning engine"
requires-python = ">=3.14"

dependencies = [
    "networkx>=3.0",
]

[project.scripts]
atlas = "atlas_cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]